    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="global.styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@300..900&family=Syne:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fragment+Mono&display=swap"
      rel="stylesheet"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Nina</title>
  </head>

  <body>
    <script src="header.js" type="module"></script>
    <script src="footer.js" type="module"></script>

    <header-component></header-component>

    <div class="geist-grid-wrapper">
      <!-- Profile Section -->
      <section class="pt-14">
        <div class="grid-box grid-box-top-line pt-8">
          <div class="grid-box-verticals"></div>
          <div class="grid-crosshair-left"></div>
          <div class="grid-crosshair-right"></div>
          <div class="grid-content">
            <div
              id="profile-section"
              class="max-w-7xl mx-auto pt-8 md:pt-32"
            ></div>
          </div>
        </div>
      </section>

      <!-- Awards Section -->
      <section class="w-full">
        <div class="grid-box grid-box-top-line">
          <div class="grid-box-verticals"></div>
          <div class="grid-crosshair-left"></div>
          <div class="grid-crosshair-right"></div>
          <div class="grid-content pb-2 pt-6 px-4">
            <h3 class="z-20">Awards & Honours</h3>
          </div>
        </div>
        <div id="awards-section"></div>
      </section>

      <!-- Free Time Section -->
      <section class="w-full">
        <div class="grid-box grid-box-top-line">
          <div class="grid-box-verticals"></div>
          <div class="grid-crosshair-left"></div>
          <div class="grid-crosshair-right"></div>
          <div class="grid-content pb-2 pt-6 px-4">
            <h3 class="z-20">In my free time you can find me...</h3>
          </div>
        </div>
        <div id="freetime-section"></div>
      </section>
    </div>

    <!-- Designing harmony section -->
    <section class="justify-center bg-black w-[100%] pt-8 md:pt-16">
      <div class="px-4 lg:px-16 2xl:px-4 max-w-7xl mx-auto">
        <h3 class="text-white">Designing harmony, one pixel at a time.</h3>
        <h6 class="text-grey pt-4">
          Play a song that holds a special place in my heart
        </h6>
      </div>
      <div class="max-w-7xl mx-auto px-4 lg:px-0">
        <div id="sketch-container" class="w-full overflow-hidden"></div>
      </div>
    </section>

    <script type="module" src="about.js"></script>
    <footer-component></footer-component>
    <script type="module" src="cursor.js"></script>

    <!-- Load p5.js and sketches AFTER everything else -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
    <script type="module" src="sketch.js"></script>
  </body>
</html>
