<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->

      async
      src="https://www.googletagmanager.com/gtag/js?id=G-E6RS5N28XQ"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-E6RS5N28XQ");
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="global.styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@300..900&family=Syne:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <title>Nina's Portfolio</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fragment+Mono&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <script src="header.js" type="module"></script>
    <!-- header.js is the name of the reusable component script -->
    <script src="footer.js" type="module"></script>
    <header-component></header-component>
    <!-- Wrapper now handles side margin/padding gutters smoothly across screen sizes -->
    <div class="geist-grid-wrapper">
      <!-- HERO SECTION -->
      <section class="py-14 lg:pb-24">
        <div class="grid-box grid-box-top-line py-8">
          <!-- Continuous vertical side lines extending upward -->
          <div class="grid-box-verticals"></div>

          <!-- Thin 24px Crosshairs -->
          <div class="grid-crosshair-left"></div>
          <div class="grid-crosshair-right"></div>

          <div class="grid-content">
            <div class="max-w-7xl mx-auto">
              <div
                class="flex flex-col items-center justify-center w-full relative pt-8 md:pt-0"
              >
                <div
                  id="ascii-music-container"
                  class="z-[-1] overflow-hidden"
                ></div>
              </div>

              <div
                class="flex flex-col items-center md:flex-row w-full justify-center gap-8"
              >
                <div class="flex flex-col items-center flex-1 gap-8 md:gap-4">
                  <div class="max-w-3xl mx-auto space-y-8 md:space-y-6">
                    <h2
                      id="hero-title-transition"
                      class="text-center pt-8 md:pt-0 z-20"
                    >
                      Hey I am Nina, a ux/ui designer.
                    </h2>
                    <p
                      class="smolwidth text-center text-grey z-20 px-2 sm:px-0"
                    >
                      /* Across disciplines, I stay in tune with the user
                      experience */
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- FEATURED WORKS SECTION -->
      <section class="w-full">
        <div class="grid-box grid-box-top-line">
          <!-- Continuous vertical side lines -->
          <div class="grid-box-verticals"></div>

          <!-- Thin 24px Crosshairs -->
          <div class="grid-crosshair-left"></div>
          <div class="grid-crosshair-right"></div>

          <div class="grid-content px-4 py-4">
            <h3 class="z-20">Featured Works</h3>
          </div>
        </div>
      </section>
    </div>
    <!-- Cards Sections -->
    <section class="cards-section"></section>
    <section class="cards-section"></section>
    <section class="cards-section"></section>
    <section class="cards-section"></section>
    <!-- Footer Visualizer -->
    <section
      class="justify-center bg-black w-[100%] pt-8 md:pt-16 px-4 md:px-16 lg:px-[7.95rem] md:gap-x-4"
    >
      <div
        class="px-4 lg:px-6 2xl:px-10 max-w-7xl mx-auto lg:pt-4 max-w-7xl mx-auto"
      >
        <h3 class="text-white">Designing harmony, one pixel at a time.</h3>
        <h6 class="text-grey pt-4">
          Play a song that holds a special place in my heart :>
        </h6>
      </div>
      <div class="max-w-7xl mx-auto px-4 lg:px-0">
        <div id="sketch-container" class="w-full overflow-hidden"></div>
      </div>
    </section>

    <script type="module" src="main.js"></script>
    <footer-component></footer-component>
    <script type="module" src="cursor.js"></script>

    <!-- Load p5.js and sketches AFTER everything else -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
    <script type="module" src="text-transition.js"></script>
    <script type="module" src="sketch.js"></script>
    <script type="module" src="ascii-music.js"></script>
  </body>
</html>
